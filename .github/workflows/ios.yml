name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config cmake go nasm ffmpeg

      - name: Install CMake 3.31 and protoc 28.3
        run: |
          curl -fL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          mkdir -p /tmp/cmake-3.31
          tar -xzf /tmp/cmake.tar.gz -C /tmp/cmake-3.31 --strip-components=1
          echo "/tmp/cmake-3.31/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          curl -fL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-osx-universal_binary.zip
          mkdir -p /tmp/protoc-28.3
          unzip -o /tmp/protoc.zip -d /tmp/protoc-28.3
          sudo cp /tmp/protoc-28.3/bin/protoc /usr/local/bin/protoc
          /tmp/cmake-3.31/CMake.app/Contents/bin/cmake --version
          protoc --version
          PROTOC_VERSION=$(protoc --version | cut -d' ' -f2)
          echo "protoc version: ${PROTOC_VERSION}"
          mkdir -p external/adb-mobile/porting
          printf '# protobuf %s\n' "${PROTOC_VERSION}" > external/adb-mobile/porting/protobuf.rb
          printf '# protobuf %s\n' "${PROTOC_VERSION}" > porting/protobuf.rb
          grep "${PROTOC_VERSION}" external/adb-mobile/porting/protobuf.rb

      - name: Fetch protobuf tags
        run: |
          cd external/adb-mobile/external/protobuf
          git fetch --tags
          git rev-parse v28.3

      - name: Create libs output directories
        run: |
          mkdir -p porting/libs/iphoneos/arm64 porting/libs/iphonesimulator/arm64 porting/libs/iphonesimulator/x86_64

      - name: Install gas-preprocessor
        run: |
          curl -fL -o /tmp/gas-preprocessor.pl https://github.com/libav/gas-preprocessor/raw/master/gas-preprocessor.pl
          sudo cp /tmp/gas-preprocessor.pl /usr/local/bin/gas-preprocessor.pl
          sudo chmod +x /usr/local/bin/gas-preprocessor.pl
          which gas-preprocessor.pl

      - name: Build porting libraries
        run: |
          make -C porting adb-mobile libsdl ffmpeg scrcpy vncclient openssl tsnet-forwarder

      - name: Install Pillow and generate server icon
        run: |
          pip3 install --break-system-packages pillow
          python3 scripts/make_server_icon.py

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project "scrcpy-app/Scrcpy Remote.xcodeproj" \
            -scheme "Scrcpy Remote" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/Scrcpy Remote.app" Payload/
          zip -r server-unsigned.ipa Payload
          ls -lh server-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: server-unsigned.ipa
          if-no-files-found: error
